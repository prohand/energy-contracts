name: Test Contracts Processing

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

# The jobs only read the repository: the token gets no write access.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Generate contracts data
        run: npm run build

      - name: Run tests
        run: npm test
